{% load static %}
<div class="d-flex flex-column flex-md-row flex-wrap bg-primary rounded px-4 px-md-5 px-lg-5">
  <!-- Left side -->
  <div class="col-md-6 d-flex flex-column align-items-start justify-content-center gap-3 py-5 mx-auto">
    <p class="text-white fw-semibold lh-sm display-6">
      Book Appointment <br /> with Trusted Doctors
    </p>

    <div class="d-flex flex-column flex-md-row align-items-center gap-2 text-white small fw-light">
      <img src="{% static 'image/group_profiles.png' %}" alt="Profiles" class="img-fluid" style="width: 7rem;" />
      <p class="mb-0">
        Simply browse through our extensive list of trusted doctors,
        <br class="d-none d-sm-block" />
        schedule your appointment hassle-free.
      </p>
    </div>

    <a href="#speciality" class="btn btn-light rounded-pill d-flex align-items-center gap-2 text-secondary small mt-3 mt-md-0">
      Book appointment 
      <img src="{% static 'image/arrow_icon.svg' %}" alt="Arrow" style="width: 12px;" />
    </a>
  </div>

  <!-- Right side -->
  <div class="col-md-6 position-relative">
    <img src="{% static 'image/header_img.png' %}" alt="Header" class="w-100 position-md-absolute bottom-0 rounded" />
  </div>
</div>
